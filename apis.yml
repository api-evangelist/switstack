aid: switstack
name: Switstack
description: >-
  Switstack is a payment infrastructure company building software-defined EMV acceptance for physical retail.
  It ships three products: switstack moka, a source-available EMV Level 2 kernel stack with brand Letters of
  Compliance; Switcloud, a hosted "universal compliance infrastructure" that abstracts EMV L2 execution and
  centralizes estate (organization/merchant/store/POI) and EMV configuration (CAPK, BIN, CRL, kernel parameter)
  management behind a REST API; and Swittest, a managed EMV functional test-automation service for labs and
  developers certifying card-present applications. The platform is terminal-agnostic and L2-stack agnostic —
  one L3 application runs across Android COTS tap-to-pay devices and PCI-PTS terminals via a GLA adapter layer —
  and Switstack supplies pre-certified PCI MPoC software and service components to shrink certification scope.
