apis:
- name: Switcloud API
  description: >-
    REST API for the Switcloud platform, organized in three surfaces: switcloud-bom (estate — merchants, stores and
    points of interaction), switcloud-config (EMV L2 configuration — BINs, BIN lists/configs, CAPKs and CAPK lists,
    CRs and CR lists, EMVs and EMV lists/configs, POI configs) and switcloud-payment (payment lifecycle plus the
    encrypted transaction log data sets). OAuth 2.0 password / client-credentials grant issues a bearer token from
    /auth/token. Version 2.28.0 publishes 106 operations across 40 paths as OpenAPI 3.1.0.
  humanURL: https://docs.switstack.io/switcloud/
  baseURL: https://switcloud.switstack.io/
  tags:
  - payments
  - emv
  - emv-level-2
  - card-present
  - estate-management
  - point-of-sale
  - in-store-payments
  properties:
  - type: OpenAPI
    url: openapi/switstack-switcloud-openapi.yml
  - type: APIReference
    url: https://docs.switstack.io/api/switcloud/api/switcloud-srv/
  - type: Documentation
    url: https://docs.switstack.io/switcloud/
  - type: GettingStarted
    url: https://docs.switstack.io/switcloud/getting_started/
  - type: Authentication
    url: https://docs.switstack.io/switcloud/security_authentication/
  - type: Overlay
    url: overlays/switstack-switcloud-overlay.yaml
  - type: DataModel
    url: data-model/switstack-data-model.yml
- name: Swittest API
  description: >-
    REST API for the Swittest managed EMV test-automation service. Exposes test-suite and test discovery, test
    execution (including a streaming run channel and ad-hoc custom tests), configuration-file browsing, scope
    verification for BIN/CAPK/CR/EMV definitions, and TLV/tag/log parsers for Eval+ output. OAuth 2.0 password
    grant issues a bearer token from /auth/token. Version 0.13.0 publishes 22 operations across 22 paths as
    OpenAPI 3.1.0. Switstack hosts separate Swittest instances per customer or partner, so no single public base
    URL is published.
  humanURL: https://docs.switstack.io/swittest/
  tags:
  - emv
  - emv-level-2
  - certification-testing
  - card-present
  - payment-terminals
  properties:
