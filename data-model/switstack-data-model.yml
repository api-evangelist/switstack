swittest_model:
  note: >-
    Swittest is a separate, mostly non-relational model — documents rather than linked entities — and it re-declares
    the Switcloud EMV config shapes so a test can carry its own scope.
  entities: [TestSuiteSchema, TestSchema, TestListSchema, TestResultSchema, CustomTestSchema, RunTestSchema,
    RunCustomTestSchema, ConfigSchema, EnvironmentSchema, CustomEnvironmentSchema, ExpectationsSchema,
    ExpectationsPartSchema, ExpectationsDataSchema, OutcomeParameterSetSchema, POIConfigSchema, EMVConfigSchema,
    EMVListSchema, EMVSchema, EMVScopeSchema, BINConfigSchema, BINListSchema, BINSchema, BINScopeSchema,
    CAPKListSchema, CAPKSchema, CAPKScopeSchema, CRListSchema, CRSchema, CRScopeSchema, PaymentSchema,
    ParsedTag, TagDescription, BitBlock, BitSection, ByteBlock, IntermediateSignalSchema,
    UserInterfaceRequestDataSchema, ErrorIndicationSchema, RestartSchema, SettingsSchema, ListDirectorySchema]
  relationships:
  - {from: TestSuiteSchema, to: TestSchema, kind: has_many, via: tests}
  - {from: TestSchema, to: ExpectationsSchema, kind: has_one, via: expectations}
  - {from: TestSchema, to: ConfigSchema, kind: has_one, via: config}
  - {from: ConfigSchema, to: POIConfigSchema, kind: has_one, via: poi_config}
  - {from: TestResultSchema, to: PaymentSchema, kind: has_one, via: payment}
  cross_product_note: >-
    "Swittest relies on Switcloud to handle card processing data (configuration and payments)" —
    https://docs.switstack.io/swittest/architecture/. The duplicated config schemas are the seam between the two
    products.
