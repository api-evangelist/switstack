  id_style: uuid
  tenancy_field: organization_id
  note: >-
    Derived from schema $ref links and *_id reference fields. Switcloud has three clean domains — estate (BOM), EMV
    configuration, and payment — joined at POIConfig, which is the object a terminal fetches at runtime. Every entity
    carries organization_id; there is no Organization resource in the API (organizations are provisioned out of band),
    so it is modelled here as an implicit root.
