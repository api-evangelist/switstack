domain_standards:
  note: >-
    Switstack's real conformance story is EMV and PCI, not web-API standards. These are the standards the product is
    built to implement, captured from the provider's own published documentation. They are IMPLEMENTATION scope
    statements, not certificates held by Switstack unless marked otherwise.
  entries:
  - id: emv-level-2
    conforms: true
    kind: certified-component
    evidence: >-
      "switcloud includes moka, a pre-certified EMV Level 2 kernel with available Letters of Compliance (LoC) for major
      payment brands" — https://docs.switstack.io/switcloud/certification_overview/. The FAQ states LoCs are included
      for moka so integrators "do not need to repeat L2 certification", with the caveat that "some limited additional
      testing may be required with certain COTS devices".
  - id: pci-mpoc
    conforms: partial
    kind: certified-component
    evidence: >-
      Switstack supplies an MPoC Software Component (on-device SDK) and an MPoC Service Component (cloud orchestration
      plus attestation & monitoring) described as "certified under MPoC Service requirements"; the integrator still
      completes final MPoC certification for its own payment app.
      https://docs.switstack.io/switcloud/faq/
  - id: pci-pts
    conforms: n/a
    kind: leveraged
    evidence: >-
      For PCI-PTS terminals Switstack integrates the vendor's certified kernel and "leverages the PTS security to
      ensure cardholder data security"; no new certification scope is introduced.
  - id: p2pe
    conforms: partial
    kind: platform-dependent
    evidence: >-
      "PCI-PTS devices: P2PE is device-specific and supported natively through the terminal integration. COTS devices:
      P2PE is not currently well supported across the COTS ecosystem; this is a SoftPOS market limitation."
  - id: gla-generic-level-2-api
    conforms: true
    kind: implemented
    evidence: >-
      moka exposes and switcloud-l2-kt adapts a GLA (Generic Level 2 API) interface; "Works with any GLA-compliant
      kernel natively" and non-GLA kernels are bridged by an adapter layer.
      https://docs.switstack.io/api/moka/moka/, https://docs.switstack.io/swittest/architecture/
  - id: emvco-contact-books-1-4
    conforms: true
    kind: implemented
    evidence: 'moka implements EMVCo Books 1-4 (application selection, security/key management, core, ecosystem)'
  - id: emvco-contactless-books-a-d
    conforms: true
    kind: implemented
    evidence: >-
      moka implements EMVCo Books A, B and D plus kernels C-2 (Mastercard), C-3 (Visa), C-4 (Amex), C-5 (JCB), C-6
      (Discover) and C-7 (CUP), with regional debit kernels (Interac, eftpos, RuPay) noted
  - id: emv-oda
    conforms: true
    kind: implemented
    evidence: >-
      "ODA is an EMV mechanism used to authenticate cards offline. It includes SDA, DDA, CDA, and XDA" — moka
      implements ODA with RSA and ECC; https://docs.switstack.io/moka/security/
compliance_program:
  published: false
  certifications: []
  note: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP or GDPR posture is published, and there is no trust center, security
    page, security.txt, vulnerability-disclosure page or bug-bounty program (probe-security-programs.py returned
    vdp=none trust=none). The EMV/MPoC statements above are product-certification scope, not an organizational
    compliance program — so NO `Compliance` and NO `TrustCenter` pointer is emitted. For a payments-infrastructure
    company handling cardholder-data-adjacent flows this is the single largest published gap.
