          anyOf:
          - items:
              type: string
              enum:
              - CARD READ OK
              - TRY AGAIN
              - APPROVED
              - APPROVED - SIGN
              - DECLINED
              - ERROR - OTHER CARD
              - INSERT CARD
              - SEE PHONE
              - AUTHORISING - PLEASE WAIT
              - CLEAR DISPLAY
              - N/A
              - PROCESSING ERROR
              - PRESENT CARD
            type: array
          - type: 'null'
          title: Message Identifier
        status:
          anyOf:
          - type: string
            enum:
            - NOT READY
            - IDLE
            - READY TO READ
            - PROCESSING
            - CARD READ SUCCESSFULLY
            - PROCESSING ERROR
            - N/A
          - type: 'null'
          title: Status
        hold_time:
          anyOf:
          - type: string
            maxLength: 6
            minLength: 6
            pattern: ^([0-9]{2})+$
          - type: 'null'
          title: Hold Time
        language_preference:
          anyOf:
          - type: string
            maxLength: 16
            minLength: 16
            pattern: ^([0-9a-fA-F]{2})+$
          - type: 'null'
          title: Language Preference
      additionalProperties: false
      type: object
      title: UserInterfaceRequestDataSchema
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    OAuth2PasswordBearer:
      type: oauth2
      flows:
        password:
          scopes: {}
          tokenUrl: auth/token
