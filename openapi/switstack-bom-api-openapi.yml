components:
  schemas:
    POIBrandType:
      type: string
      enum:
      - UNDEFINED
      - SUNMI
      - CASTLES
      - PAX
      - SAMSUNG
      - GOOGLE
      title: POIBrandType
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    POIStateType:
      type: string
      enum:
      - UNDEFINED
      - PROVISIONED
      - OPERATED
      - SUSPENDED
      - PHASED_OUT
      title: POIStateType
    POIUpdateSchema:
      properties:
        name:
          type: string
          maxLength: 255
          minLength: 1
          title: Name
          examples:
          - POI name
        description:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
            examples:
            - POI description
          - type: 'null'
          title: Description
        identifier:
          type: string
          maxLength: 16
          minLength: 1
          title: Identifier
          examples:
          - '00000003'
        serial_number:
          type: string
          maxLength: 25
          minLength: 1
          title: Serial Number
          examples:
          - SN-DF2948A38DC
        brand:
          $ref: '#/components/schemas/POIBrandType'
          default: UNDEFINED
        state:
          $ref: '#/components/schemas/POIStateType'
          default: UNDEFINED
        store_id:
          type: string
          format: uuid
          title: Store Id
      additionalProperties: false
      type: object
      required:
      - name
      - identifier
      - serial_number
      - store_id
      title: POIUpdateSchema
    StoreReadSchema:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
            examples:
            - Store name
          - type: 'null'
          title: Name
        merchant_id:
