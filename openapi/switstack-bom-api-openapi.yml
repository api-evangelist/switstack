          format: uuid
          title: Merchant Id
        id:
          type: string
          format: uuid
          title: Id
        organization_id:
          type: string
          format: uuid
          title: Organization Id
        address:
          anyOf:
          - type: string
            minLength: 1
            examples:
            - 2 Bd Léon Bureau, 44200 Nantes
          - type: 'null'
          title: Address
      type: object
      required:
