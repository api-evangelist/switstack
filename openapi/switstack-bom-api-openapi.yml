            maxLength: 255
            minLength: 1
            examples:
            - Store name
          - type: 'null'
          title: Name
        merchant_id:
          type: string
          format: uuid
          title: Merchant Id
        address:
          anyOf:
          - type: string
            minLength: 1
            examples:
            - 2 Bd Léon Bureau, 44200 Nantes
