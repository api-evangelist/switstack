          title: Address
      additionalProperties: false
      type: object
      required:
      - name
      - merchant_id
      title: StoreUpdateSchema
    MerchantPartialUpdateSchema:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
            examples:
            - Merchant name
          - type: 'null'
          title: Name
      additionalProperties: false
      type: object
      title: MerchantPartialUpdateSchema
    Page_TypeVar_Customized_StoreReadSchema_:
      properties:
        items:
          items:
            $ref: '#/components/schemas/StoreReadSchema'
          type: array
          title: Items
        total:
          type: integer
          minimum: 0
          title: Total
        page:
          type: integer
          minimum: 1
          title: Page
        size:
          type: integer
          minimum: 1
          title: Size
        pages:
          type: integer
          minimum: 0
          title: Pages
      type: object
      required:
