in_band_failure_signals:
  note: >-
    Some failure information on this API is carried in 200 responses rather than HTTP status codes. These are not
    errors in the RFC 9457 sense but an agent must read them to know a call failed.
  signals:
  - api: Switcloud API
    field: PaymentReadSchema.outcome_status
    schema: OutcomeStatus
    values: [UNDEFINED, APPROVED, DECLINED, ONLINE_REQUEST, END_APPLICATION, SELECT_NEXT, TRY_ANOTHER_INTERFACE, TRY_AGAIN, NA]
    note: >-
      The EMV terminal outcome. DECLINED, END_APPLICATION, TRY_AGAIN and TRY_ANOTHER_INTERFACE are transaction
      failures returned on a successful HTTP call. These are EMV Book B outcomes, not card-issuer decline codes —
      Switstack is card-present infrastructure, not an acquirer, and publishes no ISO 8583 / scheme decline-code
      reference, so errors/switstack-decline-codes.yml is intentionally absent.
  - api: Switcloud API
    field: PaymentReadSchema.state
    schema: State
    values: [UNDEFINED, CREATED, READY, INITIATED, REQUESTED, COMPLETED]
    note: A payment stuck short of COMPLETED indicates the on-device leg did not finish.
  - api: Swittest API
    field: ErrorIndicationSchema
    note: >-
      Swittest carries an ErrorIndicationSchema component used inside test-result payloads to report per-test failure
      detail rather than as an HTTP error body.
  - api: Swittest API
    field: TestStatusEnum
    note: Per-test pass/fail status returned inside TestResultSchema and streamed over run_tests SSE events.
